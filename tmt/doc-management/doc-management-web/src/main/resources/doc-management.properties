# Override configuration file this can be external to project

spring.application.name.override=tmt-doc-management
spring.port.override=8082

#enabling the H2 console  
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true 

#spring.h2.console.enabled=true  

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

## Redis Jedis client properties
jedis.host=localhost
jedis.port=6379
jedis.password=
jedis.pool.max-total=16
jedis.pool.max-idle=8
jedis.pool.min-idle=4
