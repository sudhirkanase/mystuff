 buildscript{
	ext{
		dependencymanagementversion = '1.0.9.RELEASE'
		springbootversion = '2.3.1.RELEASE'				
	}
	
	repositories {
		mavenCentral()
	}	
	
	dependencies {
        classpath "io.spring.gradle:dependency-management-plugin:${dependencymanagementversion}"
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springbootversion}"
    }
	
 }
 
 //apply plugin: "io.spring.dependency-management"

allprojects{
	group = 'com.tmt.doc-management'
	version = '1.0.0'
	repositories {
		mavenCentral()
	}
	
}

subprojects { 
	
	apply plugin: 'java'
	apply plugin: "io.spring.dependency-management"
	apply plugin: "org.springframework.boot"
	
	ext{
		source_compatibility_version = '1.8'
		logback_version = '1.2.3'
		springCloudVersion = 'Hoxton.SR5'
	}
	
	//apply plugin 'java'	
	
	buildDir= "target"	
	
	sourceCompatibility = "${source_compatibility_version}"
	
	
	dependencies {
		//compile group: 'ch.qos.logback', name: 'slf4j', version: '1.0.7'
		//testCompile group: 'ch.qos.logback', name: 'logback-classic', version: '1.2.3'
		
		compile "ch.qos.logback:logback-classic:${logback_version}"
		testImplementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
		}
	} 
}



// External property configuration gradle.properties
task showPropertiesTask {
    println "spring.version: ${spring_version}"
    println "test.version: ${test_version}"
}